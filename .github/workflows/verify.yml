name: Verify
on:
  push:
  pull_request:
  # Installer and README clone journeys run nightly and on release tags, not on every push.
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
    inputs:
      release:
        description: Run the complete release qualification, including full declared capacity
        type: boolean
        default: false
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  ORBIT_BROWSER_PORT: '15600'
  ORBIT_ARCHIVE_PORT: '15601'
  ORBIT_DELEGATION_PORT: '15602'
  ORBIT_VIEWPORT_PORT: '15603'
  ORBIT_RECORD_LAYOUT_PORT: '15604'
  ORBIT_RELATED_RECORD_PORT: '15605'
  PROOF_PORT: '15606'
  ORBIT_LIFECYCLE_PORT: '15608'
  # Let workerd allocate inspector sockets independently of its internal sockets.
  ORBIT_INSPECTOR_PORT: '0'
  ORBIT_VIEWPORT_INSPECTOR_PORT: '0'
  ORBIT_RECORD_LAYOUT_INSPECTOR_PORT: '0'
  ORBIT_RELATED_RECORD_INSPECTOR_PORT: '0'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      light: ${{ steps.reuse.outputs.light }}
      nightly: ${{ steps.plan.outputs.nightly }}
      matrix: ${{ steps.plan.outputs.matrix }}
      journeys: ${{ steps.plan.outputs.journeys }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: bash scripts/verification-reuse.sh
      - if: steps.reuse.outputs.skip != 'true' && steps.reuse.outputs.light != 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - if: steps.reuse.outputs.skip != 'true' && steps.reuse.outputs.light != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.reuse.outputs.skip != 'true' && steps.reuse.outputs.light != 'true'
        name: Install the plan's TypeScript reader
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: plan
        if: steps.reuse.outputs.skip != 'true' && steps.reuse.outputs.light != 'true'
        name: Read the shared local and CI verification plan
        env:
          JOURNEYS: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release) }}
          NIGHTLY: ${{ github.event_name == 'schedule' }}
        run: |
          node --input-type=module -e 'import {verificationBatches} from "./scripts/verification-plan.mjs"; const include=verificationBatches({journeys:process.env.JOURNEYS==="true",nightly:process.env.NIGHTLY==="true"}); console.log("matrix="+JSON.stringify({include}));' >> "$GITHUB_OUTPUT"
          echo "journeys=$([ "$JOURNEYS" = true ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "nightly=$([ "$NIGHTLY" = true ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
  light:
    name: documentation and lock checks
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run source:check
      - run: pnpm exec rer check --profile first-party
      - run: node scripts/contract-docs.mjs check
      - run: pnpm exec rer build --site
  source:
    name: source and shared build
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source, types, boundaries and the single shared app build
        run: node scripts/verification-shard.mjs source
      - name: Retain clean authoritative source candidate
        env:
          GIT_ALLOW_PROTOCOL: file
        run: |
          node scripts/edition-authoring/cli.mjs check > /tmp/source-check.json
          pnpm exec rer describe --json > /tmp/operations.json
          node scripts/edition-authoring/cli.mjs release /tmp/orbit-source-release > /tmp/source-release.json
          git -C /tmp/orbit-source-release bundle create /tmp/orbit-source.bundle --all
      - name: Seal the emitted app for this exact commit
        run: |
          node scripts/verification-build.mjs seal
          tar -cf "$RUNNER_TEMP/orbit-build.tar" dist .wrangler/deploy verification/shared-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-shared-build
          path: ${{ runner.temp }}/orbit-build.tar
          if-no-files-found: error
      - name: Retain source shard completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-shard-source
          path: verification/ci-shards/source.json
          if-no-files-found: error
      - name: Retain authoritative source candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-authoritative-source
          path: |
            /tmp/orbit-source.bundle
            /tmp/source-check.json
            /tmp/source-release.json
          if-no-files-found: error
  shards:
    name: shards (${{ matrix.batch }})
    needs: [plan, source]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
    env:
      ORBIT_VERIFY_PREBUILT: '1'
      ORBIT_VERIFY_JOURNEYS: ${{ needs.plan.outputs.journeys }}
      ORBIT_VERIFY_NIGHTLY: ${{ needs.plan.outputs.nightly }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned package CLI for every shard
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: orbit-shared-build
          path: ${{ runner.temp }}/orbit-build
      - name: Restore the exact-commit build
        run: |
          tar -xf "$RUNNER_TEMP/orbit-build/orbit-build.tar"
          node scripts/verification-build.mjs check
      - name: Check fixed verification ports are outside automatic allocation
        run: |
          read -r ephemeral_first ephemeral_last < /proc/sys/net/ipv4/ip_local_port_range
          read -r unprivileged_first < /proc/sys/net/ipv4/ip_unprivileged_port_start
          for port in "$ORBIT_BROWSER_PORT" "$ORBIT_ARCHIVE_PORT" "$ORBIT_DELEGATION_PORT" "$ORBIT_VIEWPORT_PORT" "$ORBIT_RECORD_LAYOUT_PORT" "$ORBIT_RELATED_RECORD_PORT" "$PROOF_PORT" "$((PROOF_PORT + 1))" "$ORBIT_LIFECYCLE_PORT"; do
            if (( port < unprivileged_first || (port >= ephemeral_first && port <= ephemeral_last) )); then
              printf 'Verification port %s conflicts with host allocation policy (%s-%s, unprivileged from %s).\n' "$port" "$ephemeral_first" "$ephemeral_last" "$unprivileged_first" >&2
              exit 1
            fi
          done
      - name: Cache fallback apt archives
        if: matrix.browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rer-apt/archives
          key: chromium-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/install-chromium-deps.py') }}
      - name: Install Chromium
        if: matrix.browsers
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || \
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
      # rer refuses to start local servers below 15 GiB free; the archive lineage needs more.
      # Remove unused toolchains only until 25 GiB is free.
      - name: Reserve disk for local servers and immutable archive lineage
        if: matrix.disk
        run: |
          free_kib() { df -Pk / | awk 'END { print $4 }'; }
          for unused in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift; do
            if [ "$(free_kib)" -ge "$((25 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused"
          done
          df -h /
      - name: Verify routine product shard
        run: node scripts/verification-batch.mjs '${{ toJSON(matrix.shards) }}'
      - name: Retain rer startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-startup-diagnostics-${{ matrix.batch }}
          path: verification/startup-diagnostics/
          if-no-files-found: ignore
      - name: Retain shard completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-shard-${{ matrix.batch }}
          path: verification/ci-shards/*.json
          if-no-files-found: error
      - name: Retain product execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-evidence-${{ matrix.batch }}
          path: |
            verification/
            test-results/
            .orbit-viewport-evidence/
          include-hidden-files: true
          if-no-files-found: error
  verify:
    needs: [plan, source, shards, light]
    if: always()
    runs-on: ubuntu-24.04
    env:
      ORBIT_VERIFY_PREBUILT: '1'
    steps:
      - name: Require a successful plan and all required work
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          SOURCE: ${{ needs.source.result }}
          SHARDS: ${{ needs.shards.result }}
          LIGHT: ${{ needs.plan.outputs.light }}
          LIGHT_RESULT: ${{ needs.light.result }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          if [ "$LIGHT" = true ]; then test "$LIGHT_RESULT" = success; exit; fi
          test "$SOURCE" = success
          test "$SHARDS" = success
      - if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: orbit-shard-*
          path: verification/ci-shards
          merge-multiple: true
      - if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
        name: Require every planned shard on this commit
        env:
          ORBIT_VERIFY_JOURNEYS: ${{ needs.plan.outputs.journeys }}
          ORBIT_VERIFY_NIGHTLY: ${{ needs.plan.outputs.nightly }}
        run: |
          test '${{ needs.shards.result }}' = success
          node scripts/verification-aggregate.mjs
      - name: Retain combined routine verdicts (capacity pending)
        if: always() && needs.plan.outputs.skip != 'true' && needs.plan.outputs.light != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-routine-verification
          path: |
            verification/core-results.jsonl
            verification/ci-summary.json
          if-no-files-found: error
  release:
    if: (github.ref_type == 'tag' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release)) && needs.plan.outputs.skip != 'true'
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Check fixed verification ports are outside automatic allocation
        run: |
          read -r ephemeral_first ephemeral_last < /proc/sys/net/ipv4/ip_local_port_range
          read -r unprivileged_first < /proc/sys/net/ipv4/ip_unprivileged_port_start
          for port in "$ORBIT_BROWSER_PORT" "$ORBIT_ARCHIVE_PORT" "$ORBIT_DELEGATION_PORT" "$ORBIT_VIEWPORT_PORT" "$ORBIT_RECORD_LAYOUT_PORT" "$ORBIT_RELATED_RECORD_PORT" "$PROOF_PORT" "$((PROOF_PORT + 1))" "$ORBIT_LIFECYCLE_PORT"; do
            if (( port < unprivileged_first || (port >= ephemeral_first && port <= ephemeral_last) )); then
              printf 'Verification port %s conflicts with host allocation policy (%s-%s, unprivileged from %s).\n' "$port" "$ephemeral_first" "$ephemeral_last" "$unprivileged_first" >&2
              exit 1
            fi
          done
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: orbit-shared-build
          path: ${{ runner.temp }}/orbit-build
      - name: Restore the shared application build
        run: |
          tar -xf "$RUNNER_TEMP/orbit-build/orbit-build.tar"
          node scripts/verification-build.mjs check
      - name: Cache fallback apt archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rer-apt/archives
          key: chromium-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/install-chromium-deps.py') }}
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || \
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
      - name: Reserve disk for full-capacity D1 roundtrip
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
          node --input-type=module -e 'import {statfsSync} from "node:fs"; import {tmpdir} from "node:os"; const stats=statfsSync(tmpdir()); const bytes=stats.bavail*stats.bsize; console.log(JSON.stringify({temporaryFilesystem:tmpdir(),availableGiB:bytes/1024**3})); if(bytes<30*1024**3)throw Error("Full-capacity D1 verification requires at least 30 GiB free before datasets are built.");'
      - name: Qualify full declared capacity once, after the journey verdict
        run: node scripts/verify-capacity.mjs
      - name: Retain complete release execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-release-verification
          path: verification/
          include-hidden-files: true
          if-no-files-found: error
